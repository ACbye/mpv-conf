# ============================================================
# 以下自动 profile 迁移自 SoM-MPV-Config v4.2（仅画质，不影响键位/UI）
# 由 profile-cond（Lua 条件）按片源元数据自动匹配，播放结束自动还原
# ============================================================

# 模拟信号源（VHS/老电视转录）：按 bt.470m 色域输出 + bt.1886 显示曲线
[Analog bt.470m]
profile-desc = "Analog bt.470m"
profile-cond = p["video-params/primaries"]=="bt.470m"
target-prim = bt.470m
target-trc = bt.1886
profile-restore = copy

# SD NTSC（480i 美/日老片）：bt.601-525 色域 + nnedi3 超分 4x
# （nnedi3 两遍 append 为 SoM 原作者有意设计：2x+2x=4x 后再由 ewa 缩放收尾）
[SD NTSC]
profile-desc = "SD NTSC"
profile-cond = p["video-params/primaries"]=="bt.601-525"
target-prim = bt.601-525
target-trc = bt.1886
glsl-shaders-append = "~~/shaders/nnedi3-nns128-win8x6.hook"
glsl-shaders-append = "~~/shaders/nnedi3-nns128-win8x6.hook"
scale-antiring = 0
dscale = ewa_robidoux # Polar Hermite (0, 0)
dscale-param1 = 0.0
dscale-param2 = 0.0
dscale-antiring = 0
profile-restore = copy

# SD PAL（576i 欧/中老片）：bt.601-625 色域 + nnedi3 超分 4x
[SD PAL]
profile-desc = "SD PAL"
profile-cond = p["video-params/primaries"]=="bt.601-625"
target-prim = bt.601-625
target-trc = bt.1886
glsl-shaders-append = "~~/shaders/nnedi3-nns128-win8x6.hook"
glsl-shaders-append = "~~/shaders/nnedi3-nns128-win8x6.hook"
scale-antiring = 0
dscale = ewa_robidoux # Polar Hermite (0, 0)
dscale-param1 = 0.0
dscale-param2 = 0.0
dscale-antiring = 0
profile-restore = copy

# 常规 HD/SDR 片源（最常见）：bt.709 色域 + bt.1886 曲线，日常 1080p/蓝光自动命中
[HD BT.709 & SDR UHD]
profile-desc = "HD BT.709 & SDR UHD"
profile-cond = p["video-params/primaries"]=="bt.709"
target-prim = bt.709
target-trc = bt.1886
profile-restore = copy

# SDR 4K 广色域片源（BT.2020）：映射到 bt.709 输出（absolute 硬映射）
# 截图临时切换高比特模式（不影响日常截图路径）
[SDR UHD BT.2020]
profile-desc = "SDR UHD BT.2020"
profile-cond = p["video-params/gamma"]~="pq" and p["video-params/primaries"]=="bt.2020" and p["video-params/gamma"]=="bt.1886"
target-prim = bt.709
target-trc = bt.1886
gamut-mapping-mode = absolute
screenshot-high-bit-depth = yes
screenshot-tag-colorspace = no
profile-restore = copy

# HDR 片源（PQ/BT.2020，HDR WEB-DL/蓝光）：spline 曲线动态映射到 300nit SDR 屏
# hdr-compute-peak=yes 逐帧计算实际峰值亮度，高光不过曝、暗部不压死
# 与既有 [HDR_generic]（仅关字幕混合）互补共存
[HDR WEBDL & Blu-ray / DV Blu-ray]
profile-desc = "HDR WEBDL & Blu-ray / DV Blu-ray"
profile-cond = p["video-params/gamma"]=="pq" and p["video-params/primaries"]=="bt.2020" and p["video-params/colorlevels"]~="full"
tone-mapping = spline
target-prim = bt.709
target-trc = bt.1886
hdr-compute-peak = yes
gamut-mapping-mode = perceptual
target-peak = 300
screenshot-sw = yes
screenshot-tag-colorspace = no
profile-restore = copy

# 杜比视界 WEBDL：按 DV 官方 bt.2446a 曲线映射
# （替代原模板 [HDR_DolbyVision] 的 st2094-40，按色度矩阵触发更精准，原块已注释）
[DV WEBDL]
profile-desc = "DV WEBDL"
profile-cond = p["video-params/hw-pixelformat"]=="p010" and p["video-params/colorlevels"]=="full" and p["video-params/colormatrix"]=="dolbyvision"
tone-mapping = bt.2446a
target-prim = bt.709
target-trc = bt.1886
hdr-compute-peak = yes
gamut-mapping-mode = perceptual
target-peak = 300
screenshot-tag-colorspace = no
profile-restore = copy

# 8bit WEB-DL 片源（文件名特征 + 非10bit 视频轨）：自动开 deband 去色带
# + SDH 字幕对白标签清洗（不改字幕字体样式）
# （替换原按码率触发的 [deband_bitrate]，触发条件更精准，原块已注释）
[8-Bit WEB-DL Deband]
profile-desc = "Debanding for 8-Bit WEB"
profile-cond = (function(a) local f=(p["filename"] or ""):lower(); local match=false; for _,c in ipairs(a) do if f:match(c) then match=true; break end end; if not match then return false end; local t=p["track-list"] or {}; for _,tr in ipairs(t) do if tr.type=="video" and tr.selected then return not (tr["codec-profile"] or ""):lower():match("10") end end; return false end)({"web%-dl", "webdl", "web%-rip", "webrip", "subsplease", "erai%-raws", "tsundere%-raws", "%-varyg", "horriblesubs", "subsplus%+", "yameii"})
deband = yes
deband-iterations = 2
deband-threshold = 48
deband-range = 32
deband-grain = 10
sub-filter-sdh = yes
sub-filter-sdh-harder = yes
profile-restore = copy

# 视频与窗口 1:1 像素比时降级 bilinear：跳过复杂缩放省 GPU，肉眼无差异
[Skip Complex Scaling]
profile-desc = "No complex scaling needed - 1:1 pixel ratio"
profile-cond = (p["video-params/w"] or 0) > 0 and (p["video-params/h"] or 0) > 0 and (p["osd-dimensions/w"] or 0) > 0 and (p["osd-dimensions/h"] or 0) > 0 and (p["video-params/w"] >= p["osd-dimensions/w"] or p["video-params/h"] >= p["osd-dimensions/h"])
scale = bilinear
profile-restore = copy

# SD 片源在 4K 显示器输出时：额外 nnedi3 2x 超分再交 ewa 收尾（1080p 屏永不触发）
[SD 4K]
profile-desc = "Extra 2x nnedi3 pass for 4K output with SD"
profile-cond = (p["video-params/primaries"]=="bt.601-525" or p["video-params/primaries"]=="bt.601-625") and (p["osd-dimensions/w"] or 0) >= 3840 and (p["osd-dimensions/h"] or 0) >= 2160
glsl-shaders-append = "~~/shaders/nnedi3-nns128-win8x6.hook"
profile-restore = copy


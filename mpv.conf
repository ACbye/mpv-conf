### 文档_ https://github.com/hooke007/MPV_lazy/blob/main/portable_config/mpv.conf


 input-conf = "~~/input_uosc.conf"
 include = "~~/profiles.conf"
 include = "~~/script-opts.conf"
 use-filedir-conf = yes
#log-file = "~~desktop/mpv-lazy.log"
 ########
 # 基础 #
 ########

# 设置视频渲染器为GPU渲染，降低CPU负载
vo = gpu-next		 # <gpu-next|gpu> 视频输出驱动。许多渲染相关的选项也只能在这两项下正常工作。当前版本首选 gpu-next
gpu-context = d3d11	# <win|d3d11|winvk> 选择图形输出后端，默认 auto（此项的值与 --gpu-api=<opengl|d3d11|vulkan> 相对应）
                                     	# 非特殊情况下Win&NV用户应使用d3d11。vulkan可能的10bit问题 https://github.com/mpv-player/mpv/issues/8554
#d3d11-exclusive-fs = yes
#d3d11-flip = no

 hwdec = auto,nvdec-copy
 hwdec-codecs = h264,hevc,vp8,vp9,av1,prores

 ########
 # 功能 #
 ########

 idle = yes
#input-ipc-server = mpvpipe
 input-builtin-bindings = no
#pause = yes

 hr-seek-framedrop = no
 save-position-on-quit = yes
 watch-later-options = start,vid,aid,sid

 keep-open = yes
#ontop = yes
#border = no
 autofit-smaller = 40%x40%
 keepaspect-window = no
#auto-window-resize = no
 hidpi-window-scale = no

 demuxer-max-bytes = 1024MiB
 icc-cache = yes
 icc-cache-dir = "~~/_cache/icc"
 gpu-shader-cache = yes
 gpu-shader-cache-dir = "~~/_cache/shader"
 watch-later-directory = "~~/_cache/watch_later"


 #######
 # OSD #
 #######

 osd-on-seek = msg
#osd-blur = 1
 osd-bar-w = 100
 osd-bar-h = 1.5
 osd-bar-align-y = -1
 #osd-color = "#672168"
 #osd-border-color = "#FFFFFF"
 #osd-border-size = 1
 #osd-font-size = 40
 osd-bold = yes
 osd-color="#4667D7"
 osd-border-color="#000000"
 osd-border-size=1
 osd-font-size=35
 osd-fractions = yes
 osd-duration = 2000
 osd-playing-msg = "${filename}"
 osd-playing-msg-duration = 3000


 ########
 # 音频 #
 ########

 ao = wasapi
#audio-device = "wasapi/{xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx}"
#audio-exclusive = yes

 volume = 100
 volume-max = 130
 audio-channels = stereo
 alang = chs,sc,zh,chi,zho
 audio-file-auto = fuzzy


 ########
 # 视频 #
 ########

#icc-profile-auto = yes

#target-prim = display-p3
#target-trc = gamma2.2

 video-sync = display-resample
 video-sync-max-video-change = 5
 interpolation = yes
 tscale = oversample

 cscale = ewa_lanczossharp
 scale = ewa_lanczossharp
 scale-antiring = 0.4
 dscale = ewa_robidoux # Polar Catmull-Rom (0.0, 0.5)
 dscale-param1 = 0.0
 dscale-param2 = 0.5
 dscale-antiring = 0.5
 sigmoid-upscaling = yes
 correct-downscaling = yes

#dither-depth = 10
#dither = error-diffusion
#deband = yes

dither-depth = 8
dither = fruit

#tone-mapping = bt.2390
 gamut-mapping-mode = clip


 ####################
 # 脚本 滤镜 着色器 #
 ####################

 osc = no
#ytdl-raw-options-append = cookies-from-browser=edge

#load-scripts = no

 ########
 # 字幕 #
 ########

 sub-auto = fuzzy
 sub-file-paths = sub;subtitles
 slang = chs,sc,zh,chi,zho
 subs-fallback = yes
#blend-subtitles = video

demuxer-mkv-subtitle-preroll = yes

 sub-font = "LXGW WenKai Mono"
 sub-font-size = 44
#sub-scale-with-window = no
 sub-border-size = 4
 sub-blur = 1
 sub-color = "#FFD766"
#sub-back-color = "#641C1C1C"
#sub-shadow-offset = 2
 sub-use-margins = yes

#sub-ass-vsfilter-aspect-compat = no
 sub-ass-use-video-data = aspect-ratio
#sub-ass-override = force
#sub-ass-scale-with-window = yes
 sub-ass-force-margins = yes
#sub-ass-force-style = Fontname=LXGW WenKai Mono

#stretch-image-subs-to-screen = yes
#image-subs-video-resolution = yes


 ########
 # 截图 #
 ########

 screenshot-format = png
 screenshot-jpeg-quality = 100
#screenshot-jpeg-source-chroma = no
 screenshot-webp-lossless = yes
 screenshot-webp-compression = 0
 screenshot-jxl-distance = 0
 screenshot-tag-colorspace = no
 screenshot-high-bit-depth = no
 screenshot-template = "G:/01_Movie.影视/Capture/%F/%F_%P_%n"

 ########
 # 窗口 #
 ########

# 设置窗口大小1280x720，位置在右下角
geometry=1280x720+100%+100%
# 无边框
border=no
# 关闭内置信息显示
load-stats-overlay=no
# 贴边吸附（限win）
snap-window=yes
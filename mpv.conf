### 文档_ https://github.com/hooke007/MPV_lazy/blob/main/portable_config/mpv.conf


# 使用自定义键位表（uosc 增强键位）
 input-conf = "~~/input_uosc.conf"
# 引入自动 profile 预设组（profiles.conf）
 include = "~~/profiles.conf"
# 引入脚本选项配置（script-opts.conf）
 include = "~~/script-opts.conf"
# 允许读取视频同目录下的同名 .conf 覆盖本配置
 use-filedir-conf = yes
#log-file = "~~desktop/mpv-lazy.log"
 ########
 # 基础 #
 ########

# 设置视频渲染器为GPU渲染，降低CPU负载
vo = gpu-next		 # <gpu-next|gpu> 视频输出驱动。许多渲染相关的选项也只能在这两项下正常工作。当前版本首选 gpu-next
gpu-context = d3d11	# <win|d3d11|winvk> 选择图形输出后端，默认 auto（此项的值与 --gpu-api=<opengl|d3d11|vulkan> 相对应）
                                     	# 非特殊情况下Win&NV用户应使用d3d11。vulkan可能的10bit问题 https://github.com/mpv-player/mpv/issues/8554
#d3d11-exclusive-fs = yes
#d3d11-flip = no

# 硬件解码：auto 自动选择，nvdec-copy 为 N 卡 NVDEC 解码后拷贝回显存（兼容性最好）
 hwdec = auto,nvdec-copy
# 参与硬件解码的编码格式（含 prores）
 hwdec-codecs = h264,hevc,vp8,vp9,av1,prores

 ########
 # 功能 #
 ########

 # 无播放任务时保持进程驻留（等待下次打开文件）
 idle = yes
#input-ipc-server = mpvpipe
# 禁用 mpv 内置键位，全部由自定义键位表（input_uosc.conf）接管
 input-builtin-bindings = no
#pause = yes

# 精确跳转时不丢弃中间帧（关键帧定位画面完整）
 hr-seek-framedrop = no
# 退出时保存播放进度，下次继续播放
 save-position-on-quit = yes
# 进度记录内容：播放位置 / 视频轨 / 音频轨 / 字幕轨
 watch-later-options = start,vid,aid,sid

 # 播放结束后停留最后一帧，不自动退出
 keep-open = yes
#ontop = yes
#border = no
# 窗口尺寸上限：初始窗口不超过屏幕的 40%x40%
 autofit-smaller = 40%x40%
# 允许自由调整窗口宽高比（不锁定比例）
 keepaspect-window = no
#auto-window-resize = no
# 高分屏（DPI 缩放）下不放大窗口像素，保持 1:1 逻辑像素
 hidpi-window-scale = no

# 解封装缓冲上限 1GiB：大文件/高码率片源拖动更流畅
 demuxer-max-bytes = 1024MiB
# 开启 ICC 色彩配置缓存（加速启动）
 icc-cache = yes
 icc-cache-dir = "~~/_cache/icc"          # ICC 缓存目录
# 开启着色器编译缓存（加速重复加载）
 gpu-shader-cache = yes
 gpu-shader-cache-dir = "~~/_cache/shader" # 着色器缓存目录
# 播放进度记录存放目录
 watch-later-directory = "~~/_cache/watch_later"


 #######
 # OSD #
 #######

 # 跳转时 OSD 显示时间信息（而非进度条）
 osd-on-seek = msg
#osd-blur = 1
# OSD 进度条：宽度 100、高度 1.5、贴底对齐
 osd-bar-w = 100
 osd-bar-h = 1.5
 osd-bar-align-y = -1
 #osd-color = "#672168"
 #osd-border-color = "#FFFFFF"
 #osd-border-size = 1
 #osd-font-size = 40
# OSD 文字样式：粗体、蓝色文字、黑色描边、35 号
 osd-bold = yes
 osd-color="#4667D7"
 osd-border-color="#000000"
 osd-border-size=1
 osd-font-size=35
# 时间显示带小数秒（精确到 0.1s）
 osd-fractions = yes
# OSD 信息显示时长 2 秒
 osd-duration = 2000
# 开始播放时 OSD 显示文件名（3 秒）
 osd-playing-msg = "${filename}"
 osd-playing-msg-duration = 3000


 ########
 # 音频 #
 ########

 # 音频输出：Windows WASAPI（低延迟）
 ao = wasapi
#audio-device = "wasapi/{xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx}"
#audio-exclusive = yes

# 初始音量 100，上限 130%
 volume = 100
 volume-max = 130
# 强制立体声输出
 audio-channels = stereo
# 音轨语言优先级：中文优先
 alang = chs,sc,zh,chi,zho
# 自动匹配外挂音频文件（模糊匹配）
 audio-file-auto = fuzzy


 ########
 # 视频 #
 ########

#icc-profile-auto = yes

#target-prim = display-p3
#target-trc = gamma2.2

# 视频同步到显示器刷新率（配合帧率平滑）
 video-sync = display-resample
# 允许的最大播放速率微调范围（5% 内）
 video-sync-max-video-change = 5
# 开启帧率平滑：低帧率片源在高刷屏上播放流畅（帧混成）
 interpolation = yes
# 帧混成算法：超采样（oversample）
 tscale = oversample

 # ===== 视频缩放（迁移自 SoM-MPV-Config v4.2）=====
 # ewa_lanczossharp：Jinc3 各向异性高质量采样，放大比 spline36 更锐利、少振铃
 cscale = ewa_lanczossharp
 scale = ewa_lanczossharp
 scale-antiring = 0.4        # 抑制高对比边缘光晕（halo）
 # ewa_robidoux（Polar Catmull-Rom）：高质量降采样，4K 片源缩到 1080p 时细节更干净
 dscale = ewa_robidoux # Polar Catmull-Rom (0.0, 0.5)
 dscale-param1 = 0.0
 dscale-param2 = 0.5
 dscale-antiring = 0.5
 # sigmoid 域上采样防高光过冲；按亮度域降采样防暗部细节丢失
 sigmoid-upscaling = yes
 correct-downscaling = yes

#dither-depth = 10
#dither = error-diffusion
#deband = yes

# 8bit 固定抖动深度 + fruit 抖动：消除截断色带
dither-depth = 8
dither = fruit

#tone-mapping = bt.2390
# 色域映射方式：超色域直接截断（默认值，由自动 profile 按片源覆盖）
 gamut-mapping-mode = clip


 ####################
 # 脚本 滤镜 着色器 #
 ####################

 osc = no
#ytdl-raw-options-append = cookies-from-browser=edge

#load-scripts = no

 ########
 # 字幕 #
 ########

# 自动加载外挂字幕（模糊匹配文件名）
 sub-auto = fuzzy
# 外挂字幕搜索子目录：sub、subtitles
 sub-file-paths = sub;subtitles
# 字幕语言优先级：中文优先
 slang = chs,sc,zh,chi,zho
# 无匹配语言字幕时回退加载任意字幕
 subs-fallback = yes
#blend-subtitles = video

# MKV 内嵌字幕预加载：首帧即显示字幕，无需等待字幕轨
demuxer-mkv-subtitle-preroll = yes

# 字幕字体：霞鹜文楷（中文观感佳）
 sub-font = "LXGW WenKai Mono"
# 字幕字号 44
 sub-font-size = 44
#sub-scale-with-window = no
# 字幕样式：描边 4、边缘模糊 1、颜色暖黄（对白易读）
 sub-border-size = 4
 sub-blur = 1
 sub-color = "#FFD766"
#sub-back-color = "#641C1C1C"
#sub-shadow-offset = 2
# 字幕使用屏幕边距（不贴屏幕边缘）
 sub-use-margins = yes

#sub-ass-vsfilter-aspect-compat = no
# ASS 特效字幕按视频宽高比适配（避免拉伸变形）
 sub-ass-use-video-data = aspect-ratio
#sub-ass-override = force
#sub-ass-scale-with-window = yes
# ASS 字幕强制套用边距设置
 sub-ass-force-margins = yes
#sub-ass-force-style = Fontname=LXGW WenKai Mono

#stretch-image-subs-to-screen = yes
#image-subs-video-resolution = yes


 ########
 # 截图 #
 ########

# 截图格式：PNG
 screenshot-format = png
# JPEG 质量 100（切换 JPEG 格式时生效）
 screenshot-jpeg-quality = 100
#screenshot-jpeg-source-chroma = no
# WebP 截图：无损 + 零压缩
 screenshot-webp-lossless = yes
 screenshot-webp-compression = 0
# JXL 截图：距离 0（无损）
 screenshot-jxl-distance = 0
# 截图不嵌入色彩空间标记 / 不使用高比特输出（保持 8bit）
 screenshot-tag-colorspace = no
 screenshot-high-bit-depth = no
# 截图保存路径模板：影视库 Capture 目录（%F=文件名 %P=播放位置 %n=序号）
 screenshot-template = "G:/01_Movie.影视/Capture/%F/%F_%P_%n"

 ########
 # 窗口 #
 ########

# 设置窗口大小1280x720，位置在右下角
geometry=1280x720+100%+100%
# 无边框
border=no
# 关闭内置信息显示
load-stats-overlay=no
# 贴边吸附（限win）
snap-window=yes
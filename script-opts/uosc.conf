###不支持参数后注释，须另起一行
###不允许选项和值之间存在多余的空格

########
# 外观 #
########

# 界面缩放比例
scale=1
# 全屏时的界面缩放比例
scale_fullscreen=1.3
# 字体缩放微调
font_scale=1
# 直接绘制在视频上的文字和图标的描边粗细
text_border=1.2
# 按钮、菜单等矩形的圆角半径
border_radius=4
# 全局使用粗体字重
font_bold=no
# 颜色覆盖列表（RGB HEX）。默认：
# 颜色覆盖列表（RGB HEX），默认：foreground=ffffff,foreground_text=000000,background=000000,background_text=ffffff,window_border=000000,curtain=111111,success=a5e075,error=ff616e,match=69c5ff,heatmap=00adee
color=
# 各界面元素背景的不透明度覆盖列表，不作用于文字。默认：
# 各界面元素背景不透明度覆盖（不作用于文字），默认：timeline=0.9,position=1,chapters=0.8,slider=0.9,slider_gauge=1,controls=0,speed=0.6,menu=1,submenu=0.4,border=1,title=1,tooltip=1,thumbnail=1,curtain=0.8,idle_indicator=0.8,audio_indicator=0.5,buffering_indicator=0.3,playlist_position=0.8,heatmap=0.4,pause_indicator=0.8
opacity=
# 精细渲染功能列表（以性能为代价）：
# 逐字符精确测量文字宽度（text_width）
# 文件名排序更好处理非英语（尤其亚洲）语言，仅 Windows 可用（sorting）
refine=
# 动画时长（毫秒）
animation_duration=100
# 界面闪烁系列命令的时长，单位毫秒（flash-{element}）
flash_duration=1000
# 元素完全淡入/淡出的距离阈值（像素）
proximity_in=40
proximity_out=120
# 光标自动隐藏时同步隐藏界面（时机由 mpv.conf 的 cursor-autohide 控制）
autohide=no

##########
# 时间线 #
##########

# 当前位置的显示样式：line 线型 / bar 条型
timeline_style=line
# 线型时间线的宽度
timeline_line_width=2
# 时间线完全展开时的高度（像素），0 为禁用
timeline_size=40
# 时间线应始终完全可见的状态列表（逗号分隔）：
# 时间线应始终完全可见的状态（逗号分隔）：paused,audio,image,video,idle,windowed,fullscreen
timeline_persistency=
# 时间线背景顶部描边，用于与视频视觉分隔
timeline_border=1
# 在时间线上方滚动滚轮时，每次快进的秒数；加 ! 后缀启用精确跳转，如 5!
timeline_step=5
# 渲染流媒体内容的缓冲指示
timeline_cache=yes
# 渲染 YouTube 视频的热力图：overlay 叠加 / above 上方 / no 关闭
timeline_heatmap=overlay
# 在时间线上按鼠标右键时执行的命令，{time} 会替换为当前播放秒数
timeline_mbtn_right=
# 常驻显示迷你进度条（收起的时间线）：windowed 窗口模式 / fullscreen / always / never
# 可用 toggle-progress 命令随时切换
progress=windowed
progress_size=2
progress_line_width=20
# 章节区间指示器（动漫片头/片尾等）。格式：{类型}:{颜色}（RGB 或 RGBA HEX）
# 章节区间类型：openings/endings 动漫片头片尾、intros/outros 视频片头片尾、ads 赞助商分段
chapter_ranges=openings:30abf964,endings:30abf964,ads:c54e4e80
# 识别章节区间的补充 lua 匹配模式（ads 除外），格式：{类型}:{模式}
chapter_range_patterns=openings:オープニング;endings:エンディング
# 时间线上显示流缓冲时间（低于该秒数时显示）
buffered_time_threshold=60
# 时间戳显示模式：total 总时长 / playtime-remaining 按当前速度的剩余时间 / time-remaining 文件剩余时长
destination_time=playtime-remaining
# 时间戳显示的小数位精度
time_precision=0

##########
# 控件栏 #
##########

# 时间线上方的控件按钮列表（逗号分隔），never 禁用。
# 完整语法：[<{可见性条件>]{元素}[:{参数}][#{徽标}[>{阈值}]][?{提示}]
controls=command:info_outline:script-binding stats/display-stats-toggle?性能统计,command:perm_media:screenshot video?截图,<has_chapter>command:bookmark:script-binding uosc/chapters#chapters>0?章节,command:library_music:script-binding uosc/audio#audio>1?音轨,command:subtitles:script-binding uosc/subtitles#sub>0?字幕,space,command:skip_previous:script-binding uosc/prev?上一个,cycle:not_started:pause:no=pause/yes=play_arrow?播放/暂停,command:skip_next:script-binding uosc/next?下一个,space,gap:1,command:format_list_bulleted:script-binding uosc/playlist?播放列表,cycle:crop_free:fullscreen:no/yes=fullscreen_exit!?全屏
# 控件按钮尺寸
controls_size=50
# 控件栏与屏幕边缘的间距
controls_margin=8
# 控件之间的间距
controls_spacing=2
# 控件栏应始终可见的状态列表（逗号分隔）
controls_persistency=idle,audio

########
# 音量 #
########

# 音量控件显示位置：none 隐藏 / left 左侧 / right 右侧
volume=right
# 音量滑块尺寸
volume_size=50
# 音量滑块的边框宽度
volume_border=1
# 音量调节步进
volume_step=1
# 音量控件应始终可见的状态列表
volume_persistency=

##########
# 播放速度 #
##########

# 速度控件：拖动/滚轮调节，点击复位
speed_step=0.1
# 步进值是否为倍数（no 为绝对值 0.1）
speed_step_is_factor=no
# 速度控件应始终可见的状态列表
speed_persistency=

########
# 菜单 #
########

# 菜单项高度
menu_item_height=36
# 菜单最小宽度
menu_min_width=260
# 菜单内边距
menu_padding=4
# 是否需要按 / 或 ctrl+f 激活搜索，还是直接输入即可搜索
# 启用后无法再用打开菜单的按键关闭菜单（若该键为 unicode 字符）
menu_type_to_search=yes

########
# 顶栏 #
########

# 顶栏（含窗口控件与媒体标题）：never 隐藏 / no-border 无边框 / always 常显
top_bar=no-border
# 顶栏高度
top_bar_size=40
# 顶栏窗口控件位置：no 隐藏 / left / right
top_bar_controls=right
# 顶栏主标题：no 隐藏 / yes 继承 mpv.conf 的标题 / 自定义模板字符串，推荐 ${media-title}
top_bar_title=${media-title}
# 顶栏备用标题，留空即不使用，推荐 ${filename}
top_bar_alt_title=
# 备用标题显示方式：below 显示在主标题下方 / toggle 点击顶栏切换主备标题
top_bar_alt_title_place=below
# 加载下列类型文件时闪烁顶栏：audio,video,image,chapter
top_bar_flash_on=video,audio
# 顶栏应始终可见的状态列表
top_bar_persistency=
# 无边框模式下的窗口边框宽度
window_border_size=1

##################
# 自动加载与播放列表 #
##################

# 播放列表为空且文件播放结束时，自动加载同目录的下一个文件
# 启用时 uosc 会把 mpv 的 keep-open 设为 yes、keep-open-pause 设为 no
# 此处保持 no，实际播放列表加载由脚本 autoload.lua 完成
autoload=no
# 启用播放列表/目录随机模式（下一个播放项随机）
shuffle=no
# 自动加载与文件导航时按类型池匹配的文件类型：video,audio,image,playlist,same（same=与当前文件同类型池）
load_types=video,audio,image
# 播放列表文件类型扩展名过滤
playlist_types=m3u,m3u8,pls,url,cue

############
# 文件类型过滤 #
############

# 文件浏览器（加载/导入视频轨）的扩展名过滤
video_types=avi,flv,m2ts,m4v,mkv,mov,mp4,mpeg,mpg,ogv,rm,rmvb,ts,vob,webm,wmv
audio_types=aac,ac3,aiff,ape,au,cue,dsf,dts,flac,m4a,mid,midi,mka,mp3,mp4a,oga,ogg,opus,spx,tak,tta,wav,weba,wma,wv
image_types=apng,avif,bmp,gif,j2k,jp2,jfif,jpeg,jpg,jxl,mj2,png,svg,tga,tif,tiff,webp
# 导入字幕时的扩展名过滤
subtitle_types=ass,idx,lrc,mks,pgs,sup,srt,ssa,txt,vtt

##########
# 文件管理 #
##########

# 打开文件菜单的默认目录，{drives} 为 Windows 驱动器列表
default_directory=~/
# 浏览目录时显示隐藏文件（当前仅对点开头的文件有效）
show_hidden_files=no
# 用内置命令删除文件时移入回收站（Linux 需装 trash-cli，MacOS 需装 trash）
use_trash=yes

########
# 其他 #
########

# 暂停指示器模式：flash 闪烁 / static 常显 / manual 由命令控制
pause_indicator=flash
# 流质量菜单中列出的分辨率档位
stream_quality_options=4320,2160,1440,1080,720,480,360,240,144
# 根据界面元素可见性调整 OSD 边距
adjust_osd_margins=yes
# 禁用的界面元素列表。可用 ID：
# 可禁用的界面元素 ID：window_border,top_bar,timeline,controls,volume,idle_indicator,audio_indicator,buffering_indicator,pause_indicator
disable_elements=
# 界面语言优先级（从高到低），slang 为继承 mpv.conf 的 --slang 配置
# 也决定 download-subtitles 菜单获取字幕的语言；支持自定义 json 路径，如 languages=~~/custom.json,slang,en
languages=slang,en
# 在线字幕下载保存目录（播放 URL 时使用）；前缀 ! 强制所有字幕保存到该目录
subtitles_directory=~~/subtitles

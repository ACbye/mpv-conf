# 统计信息样式（对应 scripts/stats.lua 汉化版）
# 文字颜色：FFFFFF 白色（默认空=继承 OSD 颜色，mpv.conf 里 osd-color=#4667D7 蓝色）
font_color=FFFFFF
# tone-mapping 伪彩色可视化：按 tab 打开统计时画面显示映射前后亮度对比（蓝色=映射前将被压暗的区域，绿色=映射后保留亮度），关闭统计自动恢复
plot_tonemapping_lut=yes
# 统计信息刷新间隔 0.5 秒
redraw_delay=0.5
# 统计信息持续覆盖显示（不自动消失，按 tab 键切换）
persistent_overlay=yes
# 滤镜参数最大显示长度 1（简略显示）
filter_params_max_length=1

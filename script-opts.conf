### 文档_ https://github.com/hooke007/MPV_lazy/blob/main/portable_config/script-opts.conf

##⇘⇘脚本选项

######################
# 保存全局属性并恢复 #
######################

# 跨会话保存的属性：音量（重启后恢复上次音量）
script-opts-append = save_global_props-props=volume

################
# 新缩略图引擎 #
################

# 进度条缩略图尺寸：恢复旧汉化版默认 300x300（上游新版默认 200x200）
script-opts-append = thumbfast-max_width=300
script-opts-append = thumbfast-max_height=300

